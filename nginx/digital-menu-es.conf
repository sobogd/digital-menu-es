# digital-menu-es — static HTML landing, IP:port demo (no domain yet).
# Reference config. Install once on the VPS:
#   sudo cp nginx/digital-menu-es.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/digital-menu-es.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# deploy.sh does not touch nginx.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /home/deploy/apps/digital-menu-es;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
